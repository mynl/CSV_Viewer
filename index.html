<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Viewer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0d6efd">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

<header class="sticky-top bg-white border-bottom shadow-sm">
    <nav class="navbar py-2">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 d-flex align-items-center">
                <i class="bi bi-table me-2 text-primary h4 mb-0"></i>
                <span class="d-flex flex-column lh-1 text-center">
                    <span class="fw-bold h5 mb-0">CSV Viewer</span>
                    <span id="header-version" class="text-muted"
                          style="font-size: 0.6rem; letter-spacing: 0.05em;"></span>
                </span>
            </span>
            <div id="toolbar" class="d-none d-flex align-items-center gap-2 flex-grow-1 ms-4">
                <input type="text" id="global-filter" class="form-control form-control-sm"
                       style="max-width: 320px;" placeholder="fzf search: term 'exact !not ^pre fix$"
                       title="Space-separated terms AND together. Fuzzy by default; 'exact, !exclude, ^prefix, suffix$. Uppercase = case-sensitive.">
                <button id="clear-filters-btn" class="btn btn-sm btn-outline-secondary" title="Clear all filters">
                    <i class="bi bi-funnel"></i> Clear
                </button>
                <button id="expand-btn" class="btn btn-sm btn-outline-secondary"
                        title="Expand all columns to their full natural width (table scrolls horizontally)">
                    <i class="bi bi-arrows-angle-expand"></i> Expand
                </button>
                <button id="contract-btn" class="btn btn-sm btn-outline-secondary"
                        title="Back to fitted widths (equal-risk squeeze); also clears any dragged widths">
                    <i class="bi bi-arrows-angle-contract"></i> Contract
                </button>
                <button id="header-btn" class="btn btn-sm btn-outline-secondary"
                        title="Toggle: row 1 is a header row (auto-detected on load; click to re-interpret)">
                    <i class="bi bi-card-heading"></i> Row 1 = header
                </button>
                <button id="open-btn" class="btn btn-sm btn-outline-primary ms-auto">
                    <i class="bi bi-folder2-open"></i> Open
                </button>
            </div>
        </div>
    </nav>
</header>

<main class="container-fluid px-4 py-4">

    <!-- Ingest view -->
    <div id="ingest-view">
        <div class="row g-4 justify-content-center">
            <div class="col-lg-5 col-md-6">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-header bg-white border-bottom-0 pt-4 px-4">
                        <h5 class="card-title fw-bold text-dark mb-0">Open a file</h5>
                    </div>
                    <div class="card-body p-4">
                        <label class="form-label text-muted small fw-bold text-uppercase">Drag &amp; drop or browse</label>
                        <div id="drop-zone"
                             class="drop-zone rounded-3 border-2 border-dashed d-flex flex-column align-items-center justify-content-center p-5 bg-light">
                            <i class="bi bi-cloud-arrow-up display-4 text-muted mb-3"></i>
                            <span class="text-muted text-center px-3">Drop a CSV here or click to browse</span>
                            <input type="file" id="file-input" class="d-none" accept=".csv,.tsv,.txt,.tab,.md,.markdown">
                        </div>
                        <div class="d-grid mt-3">
                            <button id="browse-btn" class="btn btn-primary fw-bold">
                                <i class="bi bi-folder2-open me-2"></i>Browse&hellip;
                            </button>
                        </div>
                        <div class="mt-2 text-muted small">
                            <i class="bi bi-info-circle me-1"></i>
                            Comma, tab, semicolon, or pipe delimited &mdash; sniffed automatically.
                            Everything stays in your browser.
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-5 col-md-6">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-header bg-white border-bottom-0 pt-4 px-4">
                        <h5 class="card-title fw-bold text-dark mb-0">Or paste data</h5>
                    </div>
                    <div class="card-body p-4 d-flex flex-column">
                        <label class="form-label text-muted small fw-bold text-uppercase">Paste CSV / TSV text</label>
                        <textarea id="paste-input" class="form-control font-monospace small flex-grow-1"
                                  rows="8" placeholder="name,value&#10;alpha,1&#10;beta,2"></textarea>
                        <div class="d-grid mt-3">
                            <button id="paste-btn" class="btn btn-primary fw-bold">Load pasted data</button>
                        </div>
                        <div class="mt-2 text-muted small">
                            <i class="bi bi-clipboard me-1"></i>
                            Tip: Ctrl+V anywhere on this screen loads the clipboard directly.
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="ingest-error" class="row justify-content-center mt-4 d-none">
            <div class="col-lg-10">
                <div class="alert alert-danger shadow-sm border-0 mb-0" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span id="error-message"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Table view -->
    <div id="table-view" class="d-none">
        <div class="card shadow-sm border-0">
            <div class="table-wrap">
                <table id="data-table" class="table table-sm table-hover mb-0">
                    <thead id="table-head"></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
        <div id="render-cap-note" class="text-center my-3 d-none">
            <button id="show-all-btn" class="btn btn-sm btn-outline-secondary"></button>
        </div>
    </div>

</main>

<footer id="status-bar" class="d-none">
    <span id="status"></span>
</footer>

<script src="app.js"></script>
</body>
</html>
