[project]
name = "csv-grid"
version = "3.4.0"
description = "Emit csv-viewer's CsvGrid interactive tables from pandas DataFrames (Jupyter / Quarto / static HTML)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Stephen J. Mildenhall", email = "stephen.j.mildenhall@gmail.com" },
]
requires-python = ">=3.11"
dependencies = ["pandas>=2.0"]
keywords = ["csv", "dataframe", "table", "grid", "jupyter", "quarto", "pandas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/mynl/CSV_Viewer"
"Live viewer" = "https://mynl.github.io/CSV_Viewer/"
Repository = "https://github.com/mynl/CSV_Viewer"
Changelog = "https://github.com/mynl/CSV_Viewer/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csv_grid"]
