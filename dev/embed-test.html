<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CsvGrid embed test</title>
    <!-- Deliberately bare: no Bootstrap, no viewer chrome. The grid must
         look right with csv-grid.css alone (stage 3 exit criterion), and
         two instances must coexist (no shared state, no ids). Runs against
         the BUILT dist/ artifacts (stage 4 exit criterion; UMD global,
         works from file://); embed-test-es.html is the ES-module twin.
         Rebuild after source changes: node dev/build.mjs -->
    <link rel="stylesheet" href="../dist/csv-grid.css">
    <style>
        body { margin: 2rem; background: #f4f4f4; font-family: system-ui, sans-serif; }
        h2 { font-size: 1rem; }
        .pane { max-width: 900px; margin-bottom: 2.5rem; }
    </style>
</head>
<body>

<h1 style="font-size:1.3rem">CsvGrid embed test — two instances, no Bootstrap</h1>

<div class="pane">
    <h2>1 — defaults, {csv} data (toolbar, filters, sort, status)</h2>
    <div id="grid-a"></div>
</div>

<div class="pane">
    <h2>2 — {records, columns}, options: no search/expand/status,
        align 'l-c' (center lossRatio), formats [null, ',.0f', '.1%', 'year', ',.2f']</h2>
    <div id="grid-b"></div>
</div>

<script src="../dist/csv-grid.umd.js"></script>
<script>
'use strict';

new CsvGrid('#grid-a', {
    csv: `book,author,pages,price,started,rating
War and Peace,"Tolstoy, Leo",1225,24.99,2024-01-05,4.5
Middlemarch,"Eliot, George",880,18.50,2024-02-01,5
The Big Short,"Lewis, Michael",264,15.00,2024-04-10,4
Ulysses,"Joyce, James",730,-12.00,2024-05-01,2.5
Loss Models,"Klugman, Stuart",560,89.99,2024-06-01,4`,
    name: 'books.csv',
});

new CsvGrid('#grid-b', {
    records: [
        { line: 'GL', premium: 12500000, lossRatio: 0.625, year: 1995, rate: 1.05 },
        { line: 'Property', premium: 8200000, lossRatio: 0.481, year: 2005, rate: 0.98 },
        { line: 'WC', premium: 15750000, lossRatio: 0.7125, year: 2020, rate: 1.12 },
        { line: 'Auto', premium: NaN, lossRatio: null, year: 2024, rate: 1.0 },
    ],
    columns: ['line', 'premium', 'lossRatio', 'year', 'rate'],
}, {
    globalSearch: false,
    expandButtons: false,
    statusBar: false,
    align: 'l-c',                                  // center col 3 (lossRatio)
    formats: [null, ',.0f', '.1%', 'year', ',.2f'],
    worker: false,
});
</script>
</body>
</html>
